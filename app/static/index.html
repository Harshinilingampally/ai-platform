<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Doc QA</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
    textarea { width: 100%; height: 160px; font-family: inherit; font-size: 14px; padding: 8px; }
    button { margin-top: 12px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; margin-top: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Document service</h1>
  <p>Paste some text and store it.</p>
  <textarea id="text" placeholder="Paste a document here..."></textarea>
  <button onclick="send()">Store document</button>
  <pre id="out">No document stored yet.</pre>

  <script>
    async function send() {
      const text = document.getElementById('text').value;
      const out = document.getElementById('out');
      if (!text.trim()) {
        out.textContent = 'Please enter some text first.';
        return;
      }
      out.textContent = 'Sending...';
      try {
        const res = await fetch('/documents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
